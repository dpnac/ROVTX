[package]
name = "protocol-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Client SSH2/SFTP : russh + russh-sftp, known_hosts, tunnels (REQ-001/012)"

[dependencies]
thiserror.workspace = true
tokio.workspace = true
# default-features=false + ring : évite aws-lc-sys, qui exige NASM sous Windows
# MSVC (échec CI runner windows-2022, MSG-0006). Mêmes algorithmes, provider ring.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "4.0"

[dev-dependencies]
tempfile = "3"
